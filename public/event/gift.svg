<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="기프티콘 선물 박스">
  <rect width="200" height="200" fill="#FFE14D" />

  <!-- confetti -->
  <g opacity="0.9">
    <rect x="150" y="36" width="14" height="7" rx="2" transform="rotate(24 157 39)" fill="#FF9DB0" />
    <rect x="40" y="58" width="11" height="6" rx="2" transform="rotate(-18 45 61)" fill="#FFFFFF" />
    <path d="M44 150 l4 8 8 4 -8 4 -4 8 -4 -8 -8 -4 8 -4z" fill="#FFFFFF" opacity="0.85" />
    <circle cx="162" cy="132" r="4" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- shadow -->
  <ellipse cx="100" cy="170" rx="46" ry="8" fill="#000000" opacity="0.07" />

  <!-- box base -->
  <rect x="54" y="96" width="92" height="68" rx="6" fill="#FFFFFF" stroke="#2C2A26" stroke-width="4.5" />
  <!-- lid -->
  <rect x="46" y="78" width="108" height="26" rx="6" fill="#FFF7E0" stroke="#2C2A26" stroke-width="4.5" />
  <!-- vertical ribbon -->
  <rect x="91" y="78" width="18" height="86" fill="#E8503A" />
  <line x1="100" y1="104" x2="100" y2="164" stroke="#B83C2A" stroke-width="2" opacity="0.5" />

  <!-- bow -->
  <path d="M100 78 C 78 50, 50 58, 68 80 C 78 90, 92 84, 100 78 Z" fill="#E8503A" stroke="#B83C2A" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M100 78 C 122 50, 150 58, 132 80 C 122 90, 108 84, 100 78 Z" fill="#E8503A" stroke="#B83C2A" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M84 86 L100 78 L80 70" fill="none" stroke="#B83C2A" stroke-width="2" opacity="0.5" />
  <path d="M116 86 L100 78 L120 70" fill="none" stroke="#B83C2A" stroke-width="2" opacity="0.5" />
  <circle cx="100" cy="78" r="8" fill="#FF6A52" stroke="#B83C2A" stroke-width="2.5" />
</svg>
